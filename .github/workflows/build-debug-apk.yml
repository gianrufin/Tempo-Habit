name: Build Android APK & Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Web Dependencies
        run: npm install

      - name: Build Web App (Vite)
        run: npm run build

      - name: Copy Built Web Assets to Android
        run: |
          mkdir -p app/src/main/assets/web
          cp -r dist/* app/src/main/assets/web/
          echo "Web assets successfully copied into Android bundle:"
          ls -la app/src/main/assets/web

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Consistent Debug Keystore
        run: |
          mkdir -p keystore
          if [ ! -f keystore/debug.keystore ]; then
            echo "Generating consistent debug signing keystore..."
            keytool -genkeypair -v -keystore keystore/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare APK Artifacts
        id: prep_apk
        run: |
          mkdir -p release_artifacts
          APK_ORIGIN=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_ORIGIN" ]; then
            echo "Error: No APK file found in app/build/outputs/apk"
            exit 1
          fi
          echo "Found APK at: $APK_ORIGIN"
          cp "$APK_ORIGIN" release_artifacts/tempo-android-release.apk
          cp "$APK_ORIGIN" release_artifacts/tempo.apk
          cp "$APK_ORIGIN" release_artifacts/app-debug.apk
          echo "artifacts_dir=release_artifacts" >> "$GITHUB_OUTPUT"

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tempo-apk
          path: release_artifacts/*
          retention-days: 30

      - name: Publish to GitHub Release (debug-latest)
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        continue-on-error: true
        with:
          tag_name: debug-latest
          name: Tempo Android Build (Latest)
          body: |
            ## ⚡ Tempo Android APK Download
            Auto-built from commit `${{ github.sha }}`.
            
            ### Download Files:
            - **`tempo-android-release.apk`**: Direct Android package installer
            - **`tempo.apk`**: Quick package mirror
            - **`app-debug.apk`**: Standard Gradle debug build
            
            ### Installation:
            1. Download the APK file on your Android device.
            2. Open the file and enable **"Install unknown apps"** when prompted.
            3. Enjoy the complete Tempo experience!
          prerelease: false
          make_latest: true
          files: |
            release_artifacts/tempo-android-release.apk
            release_artifacts/tempo.apk
            release_artifacts/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
